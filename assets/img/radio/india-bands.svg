<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
<title id="t">Indian amateur radio bands chart</title>
<desc id="d">Chart of common Indian amateur bands from 160 metres to 23 centimetres with band names and approximate frequencies.</desc>
<style>
  .bg{fill:#0a0a0a}.ln{stroke:#2e2e2e;stroke-width:1}.hd{fill:#1a1a1a}
  .tx{fill:#f2ead9;font-family:'Courier Prime',monospace;font-size:14px}.ac2{fill:#ff6b00;font-family:'Courier Prime',monospace;font-size:15px;font-weight:bold}
  .mu{fill:#a8a091;font-family:'Courier Prime',monospace;font-size:12px}
</style>
<rect class="bg" width="800" height="360"/>
<text class="ac2" x="30" y="32">INDIAN AMATEUR BANDS · COMMON BANDS</text>
<rect class="hd" x="30" y="55" width="120" height="32"/><rect class="hd" x="150" y="55" width="220" height="32"/><rect class="hd" x="370" y="55" width="180" height="32"/><rect class="hd" x="550" y="55" width="220" height="32"/>
<text class="ac2" x="42" y="77">BAND</text><text class="ac2" x="162" y="77">FREQUENCY</text><text class="ac2" x="382" y="77">WAVELENGTH</text><text class="ac2" x="562" y="77">TYPICAL USE</text>
<line class="ln" x1="30" y1="87" x2="770" y2="87"/>
<g class="tx">
  <text x="42" y="115">160 m</text><text x="162" y="115">1.8–1.9 MHz</text><text x="382" y="115">160 m</text><text x="562" y="115">night regional</text>
  <text x="42" y="145">80 m</text><text x="162" y="145">3.5–3.9 MHz</text><text x="382" y="145">80 m</text><text x="562" y="145">night, state-wide</text>
  <text x="42" y="175">40 m</text><text x="162" y="175">7.0–7.2 MHz</text><text x="382" y="175">40 m</text><text x="562" y="175">reliable day/night</text>
  <text x="42" y="205">20 m</text><text x="162" y="205">14.0–14.35 MHz</text><text x="382" y="205">20 m</text><text x="562" y="205">long distance</text>
  <text x="42" y="235">15 m</text><text x="162" y="235">21.0–21.45 MHz</text><text x="382" y="235">15 m</text><text x="562" y="235">daytime DX</text>
  <text x="42" y="265">10 m</text><text x="162" y="265">28.0–29.7 MHz</text><text x="382" y="265">10 m</text><text x="562" y="265">sunspot-dependent</text>
  <text x="42" y="295">2 m</text><text x="162" y="295">144–146 MHz</text><text x="382" y="295">2 m</text><text x="562" y="295">local, repeaters</text>
  <text x="42" y="325">70 cm</text><text x="162" y="325">434–438 MHz</text><text x="382" y="325">70 cm</text><text x="562" y="325">local, short range</text>
</g>
<text class="mu" x="30" y="352">Band plans and power limits change. Verify current WPC rules before transmitting.</text>
</svg>
